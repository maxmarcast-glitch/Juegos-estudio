        w: 'Se pueden encadenar porque cada método devuelve un arreglo. Primero filter deja los de nivel mayor a 30, y después map convierte cada objeto en su nombre.',
        h: 'Resolvé el filter primero y aplicale el map a lo que quedó.' }
    ] },
  { id: 'i2', n: 'Callbacks y closures',
    idea: 'En JavaScript una función es un valor: se puede guardar en una variable, pasar como argumento (eso es un callback) o devolver desde otra función. Una closure es una función que recuerda las variables del lugar donde fue creada.',
    ej: `function crearContador() {
  let cuenta = 0;
  return () => ++cuenta;
}
const contar = crearContador();
console.log(contar(), contar()); // 1 2`,
    ojo: 'Pasar una función (avisar) no es lo mismo que llamarla (avisar()). Con paréntesis se ejecuta en ese momento y lo que se pasa es su resultado.',
    qs: [
      { t: 'salida', c: `function repetir(veces, accion) {
  for (let i = 0; i < veces; i++) accion(i);
}
repetir(3, n => console.log(n * n));`, o: ['0\n1\n4', '1\n4\n9', '0\n1\n2', '9'],
        w: 'repetir recibe una función y la llama en cada vuelta pasándole i (0, 1 y 2). El callback muestra el cuadrado de lo que recibe: 0, 1 y 4.',
        h: '¿Qué valores toma i y qué hace el callback con cada uno?' },
      { t: 'salida', c: `function crearContador() {
  let cuenta = 0;
  return () => ++cuenta;
}
const a = crearContador();
const b = crearContador();
a();
a();
console.log(a(), b());`, o: ['3 1', '3 3', '3 4', '1 1'],
        w: 'Cada llamada a crearContador crea una variable cuenta nueva. a y b recuerdan cada una la suya, por eso avanzan por separado: a va por 3 y b recién por 1.',
        h: '¿Cuántas variables cuenta se crearon?' },
      { t: 'salida', c: `function multiplicarPor(factor) {
  return n => n * factor;
}
const triple = multiplicarPor(3);
console.log(triple(5));`, o: ['15', '8', '35', 'Da error: factor ya no existe'],
        w: 'multiplicarPor ya terminó de ejecutarse, pero la función que devolvió sigue recordando que factor vale 3. Eso es una closure. Entonces triple(5) calcula 5 * 3.',
        h: 'La función devuelta se lleva consigo el valor de factor.' },
      { t: 'concepto', q: 'Se quiere mostrar el mensaje después de un segundo. ¿Qué tiene de malo este código?', c: `function avisar() {
  console.log("¡Tiempo!");
}
setTimeout(avisar(), 1000);`, o: ['avisar() se ejecuta en el momento; hay que pasar avisar sin paréntesis', 'Nada: muestra el mensaje después de un segundo', 'setTimeout no acepta funciones con nombre', 'Falta un return dentro de avisar'],
        w: 'Los paréntesis ejecutan la función ahí mismo, y a setTimeout le llega su resultado (undefined) en vez de la función. Lo correcto es setTimeout(avisar, 1000): se le entrega la función para que la llame después.',
        h: 'Compará avisar con avisar().' },
      { t: 'salida', c: `const acciones = [];
for (let i = 0; i < 3; i++) {
  acciones.push(() => i);
}
console.log(acciones[0](), acciones[2]());`, o: ['0 2', '3 3', '0 0', '2 2'],
        w: 'Con let, cada vuelta del for tiene su propia i, y cada función recuerda la de su vuelta. Con var habría una sola i compartida y las tres funciones devolverían 3.',
        h: 'Cada función recuerda la i de la vuelta en la que fue creada.' }
    ] },
  { id: 'i3', n: 'Asincronía',
    idea: 'Algunas tareas tardan, como esperar un tiempo o pedir datos a una API. JavaScript no se queda esperando: deja la tarea pendiente, sigue con el resto del código y vuelve cuando hay resultado. Una promesa representa ese resultado futuro, y await pausa una función async hasta que llega.',
    ej: `async function cargar() {
  const res = await fetch("https://dummyjson.com/products/1");
  const datos = await res.json();
  console.log(datos.title);
}`,
    ojo: 'Lo que escribís debajo de una llamada asíncrona se ejecuta antes de que llegue la respuesta, salvo que uses await o .then().',
    qs: [
      { t: 'salida', c: `console.log("A");
setTimeout(() => console.log("B"), 0);
console.log("C");`, o: ['A\nC\nB', 'A\nB\nC', 'B\nA\nC', 'A\nC'],
        w: 'Aunque el tiempo sea 0, el callback de setTimeout queda en una cola y se ejecuta recién cuando termina todo el código que está corriendo. Por eso C sale antes que B.',
        h: 'setTimeout nunca interrumpe el código que ya se está ejecutando.' },
      { t: 'salida', c: `const p = Promise.resolve(5);
p.then(v => console.log(v * 2));
console.log("fin");`, o: ['fin\n10', '10\nfin', 'fin', 'fin\n5'],
        w: 'El callback de .then() siempre se ejecuta después de que termina el código actual, aunque la promesa ya esté resuelta. Primero sale "fin" y después 10.',
        h: 'El .then no corre en el momento: espera a que termine lo demás.' },
      { t: 'salida', q: '¿Qué devuelve una función async?', c: `async function dato() {
  return 7;
}
const r = dato();
console.log(r instanceof Promise);`, o: ['true', 'false', '7', 'undefined'],
        w: 'Una función async siempre devuelve una promesa, aunque adentro diga return 7. Para obtener el 7 hay que esperarla: const r = await dato().',
        h: 'r no es 7. ¿Qué envuelve a ese 7?' },
      { t: 'concepto', q: 'Este código falla al ejecutarse. ¿Por qué?', c: `async function traer() {
  const res = fetch("https://dummyjson.com/users/1");
  const user = await res.json();
  console.log(user.firstName);
}`, o: ['Falta await antes de fetch: res es una promesa y no tiene .json()', 'Falta await antes de console.log', 'fetch no se puede usar dentro de una función async', 'user.firstName debería ir entre corchetes'],
        w: 'fetch devuelve una promesa. Sin await, res es esa promesa y no la respuesta, así que res.json no existe y da TypeError. Hacen falta dos await: uno para la respuesta y otro para convertirla a JSON.',
        h: 'Contá cuántas operaciones tardan y cuántos await hay.' },
      { t: 'salida', c: `async function paso() {
  console.log("1");
  await null;
  console.log("3");
}
paso();
console.log("2");`, o: ['1\n2\n3', '1\n3\n2', '2\n1\n3', '1\n2'],
        w: 'Una función async corre normalmente hasta su primer await. Ahí se pausa y le devuelve el control al código que la llamó, que muestra "2". Después retoma y muestra "3".',
        h: '¿Qué pasa con el resto del programa mientras la función está pausada en el await?' }
    ] },
  { id: 'i4', n: 'Copias y desestructuración',
    idea: 'El operador spread (...) desarma un arreglo u objeto para armar uno nuevo, así se copia sin tocar el original. La desestructuración saca valores de un objeto o arreglo y los guarda en variables en una sola línea.',
    ej: `const base = { vida: 100, mana: 30 };
const mejorado = { ...base, mana: 80 };
const { vida, mana } = mejorado;
console.log(vida, mana, base.mana); // 100 80 30`,
    ojo: 'El spread copia un solo nivel. Si adentro hay otro objeto o arreglo, la copia y el original lo siguen compartiendo.',
    qs: [
      { t: 'salida', c: `const a = [1, 2];
const b = [...a, 3];
b[0] = 99;
console.log(a, b);`, o: ['[1, 2] [99, 2, 3]', '[99, 2] [99, 2, 3]', '[1, 2] [1, 2, 3]', '[1, 2, 3] [99, 2, 3]'],
        w: '[...a, 3] crea un arreglo nuevo con los elementos de a más el 3. Como b es otro arreglo, cambiarlo no afecta a a. Con const b = a sí se compartirían.',
        h: '¿b es el mismo arreglo que a o uno nuevo?' },
      { t: 'salida', c: `const user = { nombre: "Max", rol: "admin" };
const { nombre, edad = 30 } = user;
console.log(nombre, edad);`, o: ['Max 30', 'Max undefined', 'Max admin', 'Da error'],
        w: 'La desestructuración busca en el objeto propiedades con esos nombres. nombre existe; edad no, así que toma el valor por defecto 30. Sin el = 30 valdría undefined.',
        h: 'user no tiene edad. ¿Qué hace el = 30?' },
      { t: 'salida', c: `const original = { nombre: "Robin", stats: { fuerza: 5 } };
const copia = { ...original };
copia.nombre = "Franky";
copia.stats.fuerza = 9;
console.log(original.nombre, original.stats.fuerza);`, o: ['Robin 9', 'Robin 5', 'Franky 9', 'Franky 5'],
        w: 'El spread copia el primer nivel: nombre queda separado, por eso el original sigue siendo Robin. Pero stats es un objeto, y lo que se copió fue su referencia: los dos comparten el mismo stats.',
        h: 'nombre es un texto; stats es un objeto dentro de otro.' },
      { t: 'salida', c: `const [primero, , tercero] = ["oro", "plata", "bronce"];
console.log(primero, tercero);`, o: ['oro bronce', 'oro plata', 'oro undefined', 'Da error'],
        w: 'En los arreglos la desestructuración va por posición. La coma sin nombre saltea el segundo elemento, así que tercero toma "bronce".',
        h: 'Entre las dos comas hay un lugar vacío.' },
      { t: 'salida', c: `const defaults = { tema: "claro", sonido: true };
const prefs = { tema: "oscuro" };
const final = { ...defaults, ...prefs };
console.log(final);`, o: ['{ tema: "oscuro", sonido: true }', '{ tema: "claro", sonido: true }', '{ tema: "oscuro" }', 'Da error: tema está repetido'],
        w: 'Cuando una clave se repite, gana la que se escribe última. prefs va después y pisa el tema de defaults; sonido se mantiene porque prefs no lo tiene. Es el patrón típico para combinar valores por defecto con preferencias.',
        h: 'Si una clave aparece dos veces, ¿cuál queda?' }
    ] }
] }
];


const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NIVELES = [...FINAL, ...BASE];
const TEMAS = NIVELES.flatMap(n => n.temas.map(t => ({...t, final: !!n.final, nivel: n.final ? n.nombre : 'Nivel ' + n.nombre.toLowerCase()})));
const tema = id => TEMAS.find(t => t.id === id);
const pregunta = qid => { const [tid, i] = qid.split('-'); const t = tema(tid); return t && t.qs[+i] ? {...t.qs[+i], qid, tema: t.n} : null; };
const mezclar = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const dia = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

/* ---------- resaltado de código ---------- */
const RE = /(\/\/.*)|(&quot;.*?&quot;|&#39;.*?&#39;)|\b(const|let|var|function|return|if|else|for|while|of|in|new|async|await|try|catch|throw|break|continue|typeof|instanceof)\b|\b(\d+(?:\.\d+)?|true|false|null|undefined)\b/g;
const pintar = linea => esc(linea).replace(RE, (m, c, s, k) => `<span class="${c ? 'c' : s ? 's' : k ? 'k' : 'n'}">${m}<\/span>`);
const codigo = src => `<pre class="code" tabindex="0" aria-label="Código">${src.split('\n').map(l => `<span class="l">${pintar(l) || ' '}<\/span>`).join('')}<\/pre>`;

/* ---------- progreso ---------- */
const CLAVE = 'bucle-js-v1';
let P = {xp: 0, temas: {}, fallos: [], dia: '', racha: 0};
let ref = null, guardando = Promise.resolve(), nube = false;
const limpio = d => ({xp: Number(d.xp) || 0, temas: d.temas && typeof d.temas === 'object' ? JSON.parse(JSON.stringify(d.temas)) : {}, fallos: Array.isArray(d.fallos) ? d.fallos.filter(pregunta) : [], dia: d.dia || '', racha: Number(d.racha) || 0});
function guardar() {
  try { localStorage.setItem(CLAVE, JSON.stringify(P)); } catch {}
  if (ref) { const copia = JSON.parse(JSON.stringify(P)); guardando = guardando.then(() => ref.set(copia)).catch(() => {}); }
}
async function iniciarGuardado() {
  try { const raw = localStorage.getItem(CLAVE); if (raw) P = limpio(JSON.parse(raw)); } catch {}
  render();
  let db = null;
  try { db = await window.claude?.use?.('db'); } catch {}
  if (!db) return;
  try {
    ref = db.doc('progreso/jugador');
    const s = await ref.get();
    nube = true;
    if (s.exists) { const d = limpio(s.data()); if (d.xp >= P.xp) P = d; else guardar(); }
    else if (P.xp) guardar();
    if (V.pantalla === 'mapa') render();
  } catch { ref = null; }
}

/* ---------- estado de la partida ---------- */
const V = {pantalla: 'mapa', ses: null};
const estrellas = (n, total = 5) => { const r = n / total; return r >= 1 ? 3 : r >= 0.8 ? 2 : r >= 0.6 ? 1 : 0; };
const rango = xp => xp >= 500 ? 'Maestro del bucle' : xp >= 250 ? 'Depurador' : xp >= 100 ? 'Aprendiz' : 'Novato';
const siguiente = () => TEMAS.find(t => !P.temas[t.id]) || TEMAS.find(t => estrellas(P.temas[t.id].mejor, t.qs.length) < 3) || null;

function empezar(qids, t, titulo) {
  V.ses = {tema: t || null, titulo: titulo || '', cola: [...qids], total: qids.length, hechas: 0, primer: 0, xp: 0, fallados: [], vistos: {}, actual: null};
  V.pantalla = t ? 'leccion' : 'pregunta';
  if (!t) cargarPregunta();
  render();
}
function cargarPregunta() {
  const s = V.ses, q = pregunta(s.cola[0]);
  s.actual = {q, ops: mezclar(q.o.map((txt, i) => ({txt, ok: i === 0}))), elegida: null, pista: false, reintento: !!s.vistos[q.qid]};
}
function responder(i) {
  const s = V.ses, a = s.actual;
  if (!a || a.elegida !== null) return;
  a.elegida = i;
  const ok = a.ops[i].ok, qid = a.q.qid;
  if (ok) {
    const g = a.reintento ? 4 : a.pista ? 6 : 10;
    s.xp += g; P.xp += g; s.hechas++;
    if (!a.reintento) s.primer++;
    if (!a.reintento) P.fallos = P.fallos.filter(x => x !== qid);
    s.cola.shift();
  } else {
    if (!s.fallados.includes(qid)) s.fallados.push(qid);
    if (!P.fallos.includes(qid)) P.fallos.push(qid);
    s.cola.push(s.cola.shift());
  }
  s.vistos[qid] = true;
  guardar(); render();
  const b = $('#seguir'); if (b) b.focus();
}
function avanzar() {
  const s = V.ses;
  if (!s.cola.length) return terminar();
  cargarPregunta(); render();
}
function terminar() {
  const s = V.ses, hoy = dia();
  if (s.tema) {
    const prev = P.temas[s.tema.id] || {mejor: 0, veces: 0};
    P.temas[s.tema.id] = {mejor: Math.max(prev.mejor, s.primer), veces: prev.veces + 1};
  }
  if (P.dia !== hoy) {
    const ayer = new Date(); ayer.setDate(ayer.getDate() - 1);
    P.racha = P.dia === dia(ayer) ? P.racha + 1 : 1; P.dia = hoy;
  }
  guardar(); V.pantalla = 'fin'; render();
}

/* ---------- pantallas ---------- */
function cabecera() {
  const hechos = TEMAS.filter(t => P.temas[t.id]).length;
  return `<header class="bar-top"><a class="volver" href="../">← Todos los juegos<\/a><h1 class="logo">Bucle<i>.js<\/i><\/h1>
    <div class="kpis"><span class="kpi"><b>${P.xp}<\/b> XP · ${rango(P.xp)}<\/span><span class="kpi"><b>${P.racha}<\/b> ${P.racha === 1 ? 'día seguido' : 'días seguidos'}<\/span><span class="kpi"><b>${hechos}<\/b> de ${TEMAS.length} temas<\/span><\/div><\/header>`;
}
function tarjeta(t, sig, num) {
  const p = P.temas[t.id], tot = t.qs.length, e = p ? estrellas(p.mejor, tot) : 0;
  return `<button class="tema${sig && sig.id === t.id ? ' sig' : ''}" type="button" data-tema="${t.id}">
    <span class="num">${esc(t.dif || num)}<\/span><span class="nom">${esc(t.n)}<\/span>
    <span class="est">${p ? `<b aria-hidden="true">${'★'.repeat(e)}${'☆'.repeat(3 - e)}<\/b><br>Mejor: ${p.mejor} de ${tot} a la primera` : `${tot} desafíos · sin jugar`}<\/span><\/button>`;
}
function mapa() {
  const sig = siguiente(), nf = P.fallos.length;
  let n = 0;
  const bloque = N => `<section class="nivel">
    <div class="nivel-head"><h3>${esc(N.final ? N.nombre : 'Nivel ' + N.nombre.toLowerCase())}<\/h3><span>${esc(N.desc)}<\/span><\/div>
    <div class="temas">${N.temas.map(t => tarjeta(t, sig, String(++n).padStart(2, '0'))).join('')}<\/div><\/section>`;
  return `${cabecera()}
  <section class="hero">
    <div>
      <h2>Leé el código, predecí qué hace y entendé por qué.<\/h2>
      <p>${sig ? `${P.temas[sig.id] ? 'Te conviene repetir' : 'Seguís con'}: <b>${esc(sig.n)}<\/b>${sig.dif ? ', bloque ' + sig.dif.toLowerCase() : ''} (${esc(sig.nivel)}).` : 'Completaste todos los bloques con tres estrellas. Podés repetir cualquiera para mantenerlos frescos.'}<\/p>
      <div class="cta">
        ${sig ? `<button class="btn" type="button" data-tema="${sig.id}">${P.xp ? 'Seguir jugando' : 'Empezar'}<\/button>` : ''}
        <button class="btn ghost" type="button" data-act="simulacro">Simulacro de final<\/button>
        <button class="btn ghost" type="button" data-act="repaso" ${nf ? '' : 'disabled'}>${nf ? `Repasar mis errores (${nf})` : 'Sin errores para repasar'}<\/button>
      <\/div>
    <\/div>
    ${codigo('while (aprendiendo) {\n  leer(codigo);\n  predecir();\n  entender(porQue);\n}')}
  <\/section>
  <div class="seccion"><h2>Para el final de Programación I<\/h2><p>Un bloque medio y uno difícil por unidad, con teoría y código del material de la cursada. El simulacro mezcla 10 preguntas y carga más las de asincronía, funciones, objetos y pruebas de escritorio.<\/p><\/div>
  ${NIVELES.filter(N => N.final).map(bloque).join('')}
  <div class="seccion"><h2>Práctica libre de JavaScript<\/h2><p>Los 12 temas originales, de básico a intermedio.<\/p><\/div>
  ${(n = 0, NIVELES.filter(N => !N.final).map(bloque).join(''))}
  <p class="nota">Tres estrellas = todos los desafíos del bloque resueltos al primer intento. Cuando fallás una pregunta, vuelve a aparecer hasta que la resolvés. ${nube ? 'Tu progreso se guarda en tu cuenta.' : 'Tu progreso se guarda en este navegador.'}<\/p>`;
}
function leccion() {
  const t = V.ses.tema;
  return `<div class="fila"><button class="btn link" type="button" data-act="salir">← Volver al mapa<\/button><span class="eyebrow">${esc(t.nivel)}${t.dif ? ' · ' + t.dif : ''}<\/span><\/div>
  <article class="card">
    <p class="eyebrow">Antes de jugar<\/p>
    <h2>${esc(t.n)}<\/h2>
    <p>${esc(t.idea)}<\/p>
    ${t.puntos ? `<ul class="puntos">${t.puntos.map(x => `<li>${esc(x)}<\/li>`).join('')}<\/ul>` : ''}
    ${t.ej ? codigo(t.ej) : ''}
    <div class="ojo"><b>Error frecuente.<\/b> ${esc(t.ojo)}<\/div>
    <div class="fila"><span class="nota">Vienen ${t.qs.length} desafíos sobre este tema.<\/span><button class="btn" type="button" data-act="jugar" id="seguir">Empezar los desafíos<\/button><\/div>
  <\/article>`;
}
function pantallaPregunta() {
  const s = V.ses, a = s.actual, q = a.q, resp = a.elegida !== null, ok = resp && a.ops[a.elegida].ok;
  const titulo = q.q || '¿Qué muestra la consola?';
  return `<div class="fila"><button class="btn link" type="button" data-act="salir">← Salir<\/button>
    <div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${s.total}" aria-valuenow="${s.hechas}" aria-label="Desafíos resueltos"><i style="width:${Math.round(s.hechas / s.total * 100)}%"><\/i><\/div>
    <span class="kpi">${s.hechas} de ${s.total}<\/span><\/div>
  <article class="card">
    <p class="eyebrow">${esc(s.tema ? s.tema.n : s.titulo + ' · ' + q.tema)}${a.reintento ? ' · segundo intento' : ''}<\/p>
    <h2 class="q">${esc(titulo)}<\/h2>
    ${q.c ? codigo(q.c) : ''}
    ${q.tabla ? `<div class="traza"><table><caption>Prueba de escritorio<\/caption><thead><tr>${q.tabla.cols.map(c => `<th scope="col">${esc(c)}<\/th>`).join('')}<\/tr><\/thead><tbody>${q.tabla.filas.map(f => `<tr>${f.map(c => `<td${c === '?' ? ' class="hueco"' : ''}>${esc(c)}<\/td>`).join('')}<\/tr>`).join('')}<\/tbody><\/table><\/div>` : ''}
    <div class="ops" role="group" aria-label="Opciones">${a.ops.map((o, i) => {
      const cls = resp ? (o.ok ? ' ok' : i === a.elegida ? ' mal' : '') : '';
      const marca = resp ? (o.ok ? '<span class="marca">✓ Correcta<\/span>' : i === a.elegida ? '<span class="marca">✕ Tu respuesta<\/span>' : '') : '';
      return `<button class="op${q.t === 'salida' ? ' mono' : ''}${cls}" type="button" data-op="${i}" ${resp ? 'disabled' : ''}><kbd>${i + 1}<\/kbd><span>${esc(o.txt)}<\/span>${marca}<\/button>`; }).join('')}<\/div>
    ${!resp ? (a.pista ? `<div class="pista"><b>Pista.<\/b> ${esc(q.h)}<\/div>` : `<div class="fila"><button class="btn link" type="button" data-act="pista">Pedir una pista<\/button><span class="nota">Con pista sumás 6 XP en vez de 10.<\/span><\/div>`) : ''}
    ${resp ? `<div class="fb${ok ? '' : ' mal'}" role="status"><strong>${ok ? (a.reintento ? 'Ahora sí.' : 'Correcto.') : 'No era esa.'}<\/strong><p>${esc(q.w)}<\/p>${ok ? '' : '<p style="margin-top:8px">Esta pregunta vuelve al final para que la intentes de nuevo.<\/p>'}<\/div>
      <div class="fila"><span class="nota">${ok ? `+${a.reintento ? 4 : a.pista ? 6 : 10} XP` : ''}<\/span><button class="btn" type="button" data-act="seguir" id="seguir">${s.cola.length ? 'Siguiente' : 'Ver resultado'}<\/button><\/div>` : ''}
  <\/article>`;
}
function fin() {
  const s = V.ses, t = s.tema, e = estrellas(s.primer, s.total);
  const prox = t ? (TEMAS[TEMAS.findIndex(x => x.id === t.id) + 1] || null) : null;
  return `${cabecera()}
  <article class="card">
    <p class="eyebrow">${esc(t ? t.n : s.titulo)}<\/p>
    <h2>${s.primer === s.total ? 'Todo bien al primer intento.' : s.primer >= s.total / 2 ? 'Terminado.' : 'Terminado. Este conviene repetirlo.'}<\/h2>
    <div class="fila" style="justify-content:flex-start;gap:24px">
      <div><div class="resumen-n">${s.primer}/${s.total}<\/div><span class="nota">a la primera<\/span><\/div>
      <div><div class="resumen-n">+${s.xp}<\/div><span class="nota">XP ganados<\/span><\/div>
      ${t ? `<div><div class="estrellas" aria-label="${e} de 3 estrellas">${'★'.repeat(e)}${'☆'.repeat(3 - e)}<\/div><span class="nota">en esta partida<\/span><\/div>` : ''}
    <\/div>
    ${s.fallados.length ? `<div><p style="font-weight:700;margin-bottom:8px">Lo que te costó en esta partida<\/p><ul class="rep">${s.fallados.map(id => { const q = pregunta(id); return `<li>${esc(q.w)}<\/li>`; }).join('')}<\/ul><\/div>` : ''}
    <div class="cta">
      ${prox ? `<button class="btn" type="button" data-tema="${prox.id}" id="seguir">Siguiente tema: ${esc(prox.n)}<\/button>` : ''}
      ${t && e < 3 ? `<button class="btn sec" type="button" data-tema="${t.id}">Repetir este tema<\/button>` : ''}
      <button class="btn sec" type="button" data-act="salir" ${prox ? '' : 'id="seguir"'}>Volver al mapa<\/button>
    <\/div>
  <\/article>`;
}
function render() {
  $('#app').innerHTML = V.pantalla === 'leccion' ? leccion() : V.pantalla === 'pregunta' ? pantallaPregunta() : V.pantalla === 'fin' ? fin() : mapa();
}
function ir(p) { V.pantalla = p; render(); window.scrollTo(0, 0); }

/* ---------- eventos ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  if (b.dataset.tema) { const t = tema(b.dataset.tema); empezar(t.qs.map((_, i) => t.id + '-' + i), t); window.scrollTo(0, 0); return; }
  if (b.dataset.op) return responder(+b.dataset.op);
  const a = b.dataset.act;
  if (a === 'salir') { V.ses = null; ir('mapa'); }
  if (a === 'jugar') { cargarPregunta(); ir('pregunta'); }
  if (a === 'pista') { V.ses.actual.pista = true; render(); }
  if (a === 'seguir') { avanzar(); window.scrollTo(0, 0); }
  if (a === 'repaso') { empezar(mezclar(P.fallos).slice(0, 8), null, 'Repaso de errores'); window.scrollTo(0, 0); }
  if (a === 'simulacro') {
    const CLAVE_FINAL = ['u1d', 'u3fm', 'u3fd', 'u3am', 'u3ad', 'u5m', 'u5d'];
    const bolsa = TEMAS.filter(t => t.final).flatMap(t => t.qs.flatMap((_, i) => Array(CLAVE_FINAL.includes(t.id) ? 2 : 1).fill(t.id + '-' + i)));
    empezar([...new Set(mezclar(bolsa))].slice(0, 10), null, 'Simulacro de final'); window.scrollTo(0, 0);
  }
});
document.addEventListener('keydown', e => {
  if (V.pantalla !== 'pregunta' || e.ctrlKey || e.metaKey || e.altKey) return;
  const a = V.ses.actual, n = parseInt(e.key, 10);
  if (a.elegida === null && n >= 1 && n <= a.ops.length) { e.preventDefault(); responder(n - 1); }
});
iniciarGuardado();
</script>
